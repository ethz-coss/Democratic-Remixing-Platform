experiment:
  name: "30-day convergence with 100 agents"
  description: "Full convergence test over 30 simulated days with merge dynamics"
  run_id: "exp_05_day30"
  label: "Exp 5 - Day 30"

  simulation:
    agents: 100
    seed: 42
    target_duration_days: 30
    max_steps: 200
    remix_probability: 0.15
    merge_probability: 0.05
    migration_move_probability: 0.35
    branch_pressure: 0.5
    initial_solution_min_delay_days: 0
    initial_solution_max_delay_days: 0
    progress_every_steps: 5
    language: "de"  # "de" for German, "en" for English

  llm:
    provider: "github-models"
    model: "openai/gpt-4.1-mini"
    temperature: 0.7
    enabled: true
    token_budget: 0  # 0 = unlimited

  pocketbase:
    base_url: "http://localhost:18090"
    admin_email: ""
    admin_password: ""
