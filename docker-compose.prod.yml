services:
  pocketbase:
    image: ${POCKETBASE_IMAGE:-remix-platform/pocketbase:latest}
    restart: unless-stopped
    userns_mode: keep-id
    env_file:
      - .env.production
    environment:
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
      NO_PROXY: 'localhost,127.0.0.1,pocketbase,sveltekit'
      http_proxy: ''
      https_proxy: ''
      all_proxy: ''
      no_proxy: 'localhost,127.0.0.1,pocketbase,sveltekit'
      FRONTEND_URL: 'http://sveltekit:3000'
    volumes:
      - pb_data:/pb/pb_data
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8090/api/health']
      interval: 10s
      timeout: 5s
      retries: 5

  sveltekit:
    image: ${SVELTEKIT_IMAGE:-remix-platform/sveltekit:latest}
    restart: unless-stopped
    userns_mode: keep-id
    env_file:
      - .env.production
    environment:
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
      NO_PROXY: 'localhost,127.0.0.1,pocketbase,sveltekit'
      http_proxy: ''
      https_proxy: ''
      all_proxy: ''
      no_proxy: 'localhost,127.0.0.1,pocketbase,sveltekit'
    depends_on:
      pocketbase:
        condition: service_healthy

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
      NO_PROXY: 'localhost,127.0.0.1,pocketbase,sveltekit'
      http_proxy: ''
      https_proxy: ''
      all_proxy: ''
      no_proxy: 'localhost,127.0.0.1,pocketbase,sveltekit'
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - sveltekit
      - pocketbase

volumes:
  pb_data:
  caddy_data:
  caddy_config:
